name: Integration 0915 Gate

on:
  push:
    branches:
      - feature/integrate-0915-watch-telegram
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused integration tests
        run: >-
          node --experimental-strip-types --test
          tests/ma30-overnight-summary.test.mjs
          tests/telegram-menu-hardening.test.mjs
          tests/protection-management.test.mjs
          tests/telegram-protection-management.test.mjs
      - name: Telegram regression
        run: node --experimental-strip-types --test tests/telegram-*.test.mjs
      - name: Protection regression
        run: node --experimental-strip-types --test tests/protection-*.test.mjs
      - name: MA30 regression
        run: node --experimental-strip-types --test tests/ma30-*.test.mjs
      - name: Production build
        run: npm run build
